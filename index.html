<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancy Digital Clock</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #182848, #050816 60%);
            overflow: hidden;
        }

        /* Background circles */
        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(5px);
            opacity: 0.5;
        }

        body::before {
            width: 250px;
            height: 250px;
            background: #00eaff;
            top: -80px;
            left: -70px;
        }

        body::after {
            width: 300px;
            height: 300px;
            background: #8a2be2;
            bottom: -120px;
            right: -100px;
        }

        .clock-box {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 650px;
            padding: 45px 30px;
            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.5),
                inset 0 0 30px rgba(255, 255, 255, 0.03);
        }

        .title {
            color: #ffffff;
            font-size: 20px;
            letter-spacing: 5px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .clock {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            color: #00eaff;
            font-size: clamp(45px, 10vw, 85px);
            font-weight: bold;
            letter-spacing: 4px;

            text-shadow:
                0 0 10px #00eaff,
                0 0 25px #00eaff,
                0 0 45px rgba(0, 234, 255, 0.5);
        }

        .time-box {
            min-width: 120px;
        }

        .colon {
            animation: blink 1s infinite;
        }

        .ampm {
            margin-top: 15px;
            color: #ffffff;
            font-size: 18px;
            letter-spacing: 4px;
        }

        .date {
            margin-top: 25px;
            color: #d8faff;
            font-size: 18px;
            letter-spacing: 2px;
        }

        @keyframes blink {
            50% {
                opacity: 0.25;
            }
        }

        @media (max-width: 500px) {
            .clock-box {
                padding: 35px 15px;
            }

            .clock {
                gap: 5px;
                letter-spacing: 1px;
            }

            .time-box {
                min-width: 80px;
            }

            .title {
                font-size: 15px;
            }

            .date {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="clock-box">

        <div class="title">SaMo Clock</div>

        <div class="clock">
            <div class="time-box" id="hours">00</div>
            <div class="colon">:</div>
            <div class="time-box" id="minutes">00</div>
            <div class="colon">:</div>
            <div class="time-box" id="seconds">00</div>
        </div>

        <div class="ampm" id="ampm">AM</div>

        <div class="date" id="date">
            Loading...
        </div>

    </div>

    <script>
        function updateClock() {

            const now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            // AM / PM
            const ampm = hours >= 12 ? "PM" : "AM";

            // Convert 24-hour format to 12-hour
            hours = hours % 12;
            hours = hours === 0 ? 12 : hours;

            // Add 0 before single digit
            hours = String(hours).padStart(2, "0");
            minutes = String(minutes).padStart(2, "0");
            seconds = String(seconds).padStart(2, "0");

            // Display time
            document.getElementById("hours").textContent = hours;
            document.getElementById("minutes").textContent = minutes;
            document.getElementById("seconds").textContent = seconds;
            document.getElementById("ampm").textContent = ampm;

            // Display date
            const options = {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            };

            document.getElementById("date").textContent =
                now.toLocaleDateString("en-US", options);
        }

        // Update immediately
        updateClock();

        // Update every second
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
